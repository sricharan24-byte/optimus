warehouse:
  id: "WH_01"
  name: "Cold Storage Facility Central"
  total_capacity_tonnes: 50.0
  units:
    - id: "SU_01"
      capacity_tonnes: 20.0
      sensors: ["S_TEMP_01", "S_HUM_01", "S_OCC_01"]
    - id: "SU_02"
      capacity_tonnes: 15.0
      sensors: ["S_TEMP_02", "S_HUM_02", "S_OCC_02"]
    - id: "SU_03"
      capacity_tonnes: 15.0
      sensors: ["S_TEMP_03", "S_HUM_03", "S_OCC_03"]

telemetry:
  temp_target_c: 3.0
  temp_std_c: 0.15
  humidity_target_pct: 90.0
  humidity_std_pct: 1.2
  occupancy_noise_std: 0.015
  sample_interval_sec: 300

constraints:
  c1_capacity:
    tolerance_tonnes: 1.5
    weight: 0.40
  c2_inventory:
    tolerance_tonnes: 1.0
    weight: 0.35
  c3_historical:
    percentile_low: 10
    percentile_high: 90
    weight: 0.25

temporal:
  window_samples: 12
  decay_lambda: 0.035

structural:
  distance_decay_power: 1.0

escalation:
  threshold_low: 0.20
  threshold_suspicious: 0.40
  threshold_attack: 0.70
  weights:
    semantic: 0.45
    temporal: 0.35
    structural: 0.20
